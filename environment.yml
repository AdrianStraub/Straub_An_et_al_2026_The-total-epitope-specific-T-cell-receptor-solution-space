# Conda environment for the analysis (notebooks 01-03).
#
#     conda env create -f environment.yml
#     conda activate tcr

name: tcr
channels:
  - conda-forge
dependencies:
  - python=3.11.8
  # --- R stack (called from Python via rpy2 in the iNEXT cell) ---
  - r-base=4.3.3
  - r-inext=3.0.2        # linux only; on macOS install from source (see notebook cell 2)
  - r-remotes=2.5.0      # for version-pinned iNEXT install fallback
  - rpy2=3.5.11
  # --- Python scientific stack ---
  - numpy=2.4.6
  - pandas=2.3.3
  - scipy=1.16.3
  - seaborn=0.13.2
  - matplotlib=3.10.8
  - matplotlib-venn=1.1.2
  - statsmodels=0.14.5
  - tqdm=4.67.3
  - ipykernel=7.3.0
  - pip
  - pip:
      - logomaker==0.8.7
      - rapidfuzz==3.14.3
      - scirpy==0.22.3
      - openpyxl==3.1.5
